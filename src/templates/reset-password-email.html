<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Password Reset</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    "
  >
    <div
      style="
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 5px;
      "
    >
      <h2>Скидання паролю</h2>
      <p>
        Ви отримали цей лист, тому що зробили запит на відновлення паролю для
        вашого акаунту.
      </p>
      <p>
        Будь ласка, натисніть на посилання нижче, щоб встановити новий пароль.
        Посилання дійсне протягом 15 хвилин:
      </p>
      <p style="margin: 20px 0">
        <a
          href="{{resetUrl}}"
          style="
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 3px;
            display: inline-block;
          "
        >
          Скинути пароль
        </a>
      </p>
      <p>Якщо ви не робили цього запиту, просто проігноруйте цей лист.</p>
    </div>
  </body>
</html>
